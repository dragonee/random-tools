# What `h` talks to, and what it can run in there.
#
# `name` is docker's own name filter, which it reads as a regex — anchor it
# when a looser spelling would match more than one container. `docker ps`
# shows the names you have to choose from.
#
# The sections below are an example — an Elixir app and its database. Rename
# them, or throw them away, for whatever lives in your container.

[General]
name = ^myapp-app-1$
workdir = /app

[sh]
program = bash
help = a shell in the container

[mix]
program = mix
help = mix, inside the container: mix test, mix deps.get, ...

[iex]
program = iex -S mix
help = an IEx session with the app's code loaded

[migrate]
program = mix ecto.migrate
help = run pending migrations

[psql]
program = psql
help = psql against the dev database (via the container's PG* variables)
